<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide 00 – neubau.marketing Pitch Deck</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Roboto', sans-serif;
    background: #2c313c !important;
    color: #ffffff;
  }

  .slide-wrap {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #2c313c;
    overflow: hidden;
    z-index: 0;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80vw 70vh at 80% -15%, rgba(91,143,241,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 50vw 50vh at -10% 95%, rgba(91,143,241,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 40vw 40vh at 50% 50%, rgba(91,143,241,0.03) 0%, transparent 70%);
    pointer-events: none;
    animation: bgpulse 6s ease-in-out infinite;
  }

  @keyframes bgpulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.6; }
  }

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .center {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5vh;
  }

  .logo-wrap {
    animation: fadein 1.5s ease forwards;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-wrap img {
    width: clamp(280px, 28vw, 460px);
    height: auto;
    display: block;
  }

  .divider {
    width: clamp(60px, 6vw, 100px);
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(91,143,241,0.7), transparent);
    animation: dividerexpand 1.5s ease 0.5s both;
  }

  @keyframes dividerexpand {
    from { width: 0; opacity: 0; }
    to   { width: clamp(60px, 6vw, 100px); opacity: 1; }
  }

  .headline-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5vh;
    animation: infofadein 1.5s ease 0.8s both;
  }

  @keyframes infofadein {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .headline {
    font-size: clamp(32px, 4.5vw, 72px);
    font-weight: 900;
    line-height: 1.05;
    text-align: center;
  }

  .headline .wh { color: #ffffff; }
  .headline .bl {
    font-style: italic;
    background: linear-gradient(135deg, #5b8ff1 0%, #7aaaf5 50%, #3d5a9e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subline {
    font-size: clamp(16px, 1.3vw, 22px);
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    text-align: center;
    letter-spacing: 0.04em;
  }

  .stats {
    display: flex;
    gap: 0;
    align-items: center;
    animation: infofadein 1.5s ease 1.1s both;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6vh;
    padding: 0 4vw;
  }

  .stat + .stat {
    border-left: 1px solid rgba(255,255,255,0.12);
  }

  .stat-value {
    font-size: clamp(28px, 3.8vw, 62px);
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(135deg, #5b8ff1 0%, #7aaaf5 60%, #3d5a9e 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(91,143,241,0.3));
  }

  .stat-label {
    font-size: clamp(13px, 1vw, 16px);
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    text-align: center;
    white-space: nowrap;
  }

  .dots {
    display: flex;
    gap: 1.2vw;
    align-items: center;
    animation: infofadein 1.5s ease 1.4s both;
  }

  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(91,143,241,0.4);
    animation: dotpulse 2.4s ease-in-out infinite;
  }

  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.4s; }
  .dot:nth-child(3) { animation-delay: 0.8s; }

  @keyframes dotpulse {
    0%, 100% { background: rgba(91,143,241,0.2); transform: scale(0.8); }
    50%       { background: #5b8ff1; transform: scale(1.4); box-shadow: 0 0 12px rgba(91,143,241,0.7); }
  }

  .footer {
    position: absolute;
    bottom: 2.5vh;
    left: 4.5vw;
    right: 4.5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.15);
  }

  .footer-text {
    font-size: clamp(12px, 0.95vw, 16px);
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.08em;
    padding-top: 1.5vh;
  }
</style>
</head>
<body>

<div class="slide-wrap">
  <div class="bg"></div>

  <div class="center">

    <div class="logo-wrap">
      <img
        src="https://ik.imagekit.io/ViewRStudio/Neobau%20Digital%20GmbH/Grafik/Logo/1.png"
        alt="neubau.marketing"
      />
    </div>

    <div class="divider"></div>

    <div class="headline-wrap">
      <div class="headline">
        <span class="wh">Mehr Verk&auml;ufe.</span><br>
        <span class="bl">Nicht mehr Anfragen.</span>
      </div>
      <div class="subline">Das vollst&auml;ndige Konversionssystem f&uuml;r Neubauvermarktung im DACH-Raum.</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value">~181x</div>
        <div class="stat-label">ROI &middot; Bank 1 Saar</div>
      </div>
      <div class="stat">
        <div class="stat-value">17,30 &euro;</div>
        <div class="stat-label">Cost per Lead &middot; belegt</div>
      </div>
      <div class="stat">
        <div class="stat-value">301</div>
        <div class="stat-label">Anfragen in 5 Monaten</div>
      </div>
    </div>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <div class="footer">
    <div class="footer-text">Neobau Digital GmbH &middot; neubau.marketing</div>
    <div class="footer-text">Vertraulich &middot; Closing Deck 2026</div>
  </div>

</div>

</body>
</html>
